<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinh Nhật Hay Là Deadline?</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #111;
            color: white;
            overflow-x: hidden;
        }
        
        #game-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        #title-screen {
            text-align: center;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        h1 {
            font-size: 4rem;
            color: #ff5555;
            text-shadow: 0 0 10px #ff0000;
            margin-bottom: 20px;
        }
        
        h2 {
            font-size: 2rem;
            color: #55ff55;
            margin-bottom: 40px;
        }
        
        #start-btn {
            padding: 15px 30px;
            font-size: 1.5rem;
            background: linear-gradient(45deg, #ff5555, #ffaa00);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(255, 85, 85, 0.5);
        }
        
        #start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 85, 85, 0.8);
        }
        
        #game-screen {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .boss-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 20px;
            text-align: center;
        }
        
        .boss-title {
            font-size: 3rem;
            color: #ff5555;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #ff0000;
        }
        
        .boss-image {
            width: 300px;
            height: 300px;
            object-fit: contain;
            margin-bottom: 30px;
            animation: float 3s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        .boss-dialogue {
            font-size: 1.5rem;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            max-width: 800px;
            margin-bottom: 30px;
            border: 2px solid #ff5555;
        }
        
        .action-buttons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        
        .action-btn {
            padding: 10px 20px;
            font-size: 1.2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        #attack-btn {
            background-color: #ff5555;
            color: white;
        }
        
        #defend-btn {
            background-color: #5555ff;
            color: white;
        }
        
        #special-btn {
            background-color: #ffaa00;
            color: white;
        }
        
        .health-bar-container {
            width: 80%;
            max-width: 500px;
            height: 30px;
            background-color: #333;
            border-radius: 15px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .health-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff5555);
            width: 100%;
            transition: width 0.5s;
        }
        
        .player-health {
            background: linear-gradient(90deg, #00ff00, #55ff55);
        }
        
        #result-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 20px;
        }
        
        #result-message {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #ffaa00;
        }
        
        #restart-btn {
            padding: 15px 30px;
            font-size: 1.5rem;
            background-color: #55ff55;
            border: none;
            border-radius: 50px;
            color: #111;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        #restart-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(85, 255, 85, 0.5);
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0.7;
            z-index: 10;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            h2 {
                font-size: 1.5rem;
            }
            
            .boss-title {
                font-size: 2rem;
            }
            
            .boss-image {
                width: 200px;
                height: 200px;
            }
            
            .boss-dialogue {
                font-size: 1.2rem;
            }
            
            .action-buttons {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Title Screen -->
        <div id="title-screen">
            <h2>Trò chơi sinh tồn chiến đấu thật phong cách
            </h2>
            <button id="start-btn">BẮT ĐẦU</button>
        </div>
    
        <!-- Game Screen -->
        <div id="game-screen">
            <!-- Boss 1: Deadline thần tốc -->
            <div class="boss-container" id="boss1">
                <h2 class="boss-title">BOSS 1: Adobe bản quyền</h2>
                <div class="health-bar-container">
                    <div class="health-bar" id="boss1-health"></div>
                </div>
                <div class="health-bar-container">
                    <div class="health-bar player-health" id="player-health"></div>
                </div>
                <img src="Screenshot 2025-06-12 171824.png" alt="Deadline" class="boss-image">
                <div class="boss-dialogue">
                    "bị sập rồi"
                </div>
                <div class="action-buttons">
                    <button class="action-btn" id="attack-btn" onclick="attack(1)">Mua bản quyền</button>
                    <button class="action-btn" id="defend-btn" onclick="defend(1)">Mở lại</button>
                    <button class="action-btn" id="special-btn" onclick="special(1)">Kêu cứu(nếu mày chọn mày kém)</button>
                </div>
            </div>
            
            <!-- Boss 2: Khách hàng khó tính -->
            <div class="boss-container" id="boss2">
                <h2 class="boss-title">BOSS 2: Thằng Minh mèo</h2>
                <div class="health-bar-container">
                    <div class="health-bar" id="boss2-health"></div>
                </div>
                <div class="health-bar-container">
                    <div class="health-bar player-health" id="player-health2"></div>
                </div>
                <img src="c5e5abb4-4c37-4b5c-ada4-624751624bc6.jpg" alt="Khách hàng" class="boss-image">
                <div class="boss-dialogue">
                    "Minh mèo mà trèo cây cau hỏi thăm chú chuột đi đâu vắng nhà"
                </div>
                <div class="action-buttons">
                    <button class="action-btn" id="attack-btn" onclick="attack(2)">Giúp nó</button>
                    <button class="action-btn" id="defend-btn" onclick="defend(2)">Tắt mic nó</button>
                    <button class="action-btn" id="special-btn" onclick="special(2)">Đánh nó</button>
                </div>
            </div>
            
            <!-- Boss 3: Cái bóng của chính mình -->
            <div class="boss-container" id="boss3">
                <h2 class="boss-title">BOSS 3:  Cô Vân Anh</h2>
                <div class="health-bar-container">
                    <div class="health-bar" id="boss3-health"></div>
                </div>
                <div class="health-bar-container">
                    <div class="health-bar player-health" id="player-health3"></div>
                </div>
                <img src="Screenshot 2025-06-12 172011.png" alt="Bản thân" class="boss-image">
                <div class="boss-dialogue">
                    "awwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww"
                </div>
                <div class="action-buttons">
                    <button class="action-btn" id="attack-btn" onclick="attack(3)">Gửi file</button>
                    <button class="action-btn" id="defend-btn" onclick="defend(3)">Lên họp</button>
                    <button class="action-btn" id="special-btn" onclick="special(3)">Làm lại đẹp hơn</button>
                </div>
            </div>
            
            <!-- Result Screen -->
            <div id="result-screen">
                <h1 id="result-message"></h1>
                <button id="restart-btn">CHƠI LẠI</button>
            </div>
        </div>
    </div>

    <script>
        // Game variables
        let currentBoss = 1;
        let playerHealth = 100;
        let boss1Health = 100;
        let boss2Health = 100;
        let boss3Health = 100;
        
        // DOM elements
        const titleScreen = document.getElementById('title-screen');
        const gameScreen = document.getElementById('game-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const resultMessage = document.getElementById('result-message');
        
        // Start game
        startBtn.addEventListener('click', () => {
            titleScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            document.getElementById('boss1').style.display = 'flex';
            updateHealthBars();
        });
        
        // Restart game
        restartBtn.addEventListener('click', () => {
            currentBoss = 1;
            playerHealth = 100;
            boss1Health = 100;
            boss2Health = 100;
            boss3Health = 100;
            
            document.querySelectorAll('.boss-container').forEach(boss => {
                boss.style.display = 'none';
            });
            
            document.getElementById('boss1').style.display = 'flex';
            document.getElementById('result-screen').style.display = 'none';
            updateHealthBars();
        });
        
        // Update health bars
        function updateHealthBars() {
            document.getElementById('boss1-health').style.width = boss1Health + '%';
            document.getElementById('boss2-health').style.width = boss2Health + '%';
            document.getElementById('boss3-health').style.width = boss3Health + '%';
            
            document.getElementById('player-health').style.width = playerHealth + '%';
            document.getElementById('player-health2').style.width = playerHealth + '%';
            document.getElementById('player-health3').style.width = playerHealth + '%';
        }
        
        // Player actions
        function attack(bossNum) {
            let damage = Math.floor(Math.random() * 20) + 10;
            let bossDamage = Math.floor(Math.random() * 15) + 5;
            
            if (bossNum === 1) {
                boss1Health -= damage;
                if (boss1Health < 0) boss1Health = 0;
            } else if (bossNum === 2) {
                boss2Health -= damage;
                if (boss2Health < 0) boss2Health = 0;
            } else {
                boss3Health -= damage;
                if (boss3Health < 0) boss3Health = 0;
            }
            
            playerHealth -= bossDamage;
            if (playerHealth < 0) playerHealth = 0;
            
            updateHealthBars();
            checkBattleResult(bossNum);
        }
        
        function defend(bossNum) {
            let damage = Math.floor(Math.random() * 15) + 5;
            let bossDamage = Math.floor(Math.random() * 10) + 5;
            
            if (bossNum === 1) {
                boss1Health -= damage;
                if (boss1Health < 0) boss1Health = 0;
            } else if (bossNum === 2) {
                boss2Health -= damage;
                if (boss2Health < 0) boss2Health = 0;
            } else {
                boss3Health -= damage;
                if (boss3Health < 0) boss3Health = 0;
            }
            
            playerHealth -= bossDamage;
            if (playerHealth < 0) playerHealth = 0;
            
            updateHealthBars();
            checkBattleResult(bossNum);
        }
        
        function special(bossNum) {
            let damage = Math.floor(Math.random() * 30) + 15;
            let bossDamage = Math.floor(Math.random() * 10) + 1;
            
            if (bossNum === 1) {
                boss1Health -= damage;
                if (boss1Health < 0) boss1Health = 0;
            } else if (bossNum === 2) {
                boss2Health -= damage;
                if (boss2Health < 0) boss2Health = 0;
            } else {
                boss3Health -= damage;
                if (boss3Health < 0) boss3Health = 0;
            }
            
            playerHealth -= bossDamage;
            if (playerHealth < 0) playerHealth = 0;
            
            // Special heal for the last boss
            if (bossNum === 3) {
                playerHealth += 10;
                if (playerHealth > 100) playerHealth = 100;
            }
            
            updateHealthBars();
            checkBattleResult(bossNum);
        }
        
        // Check battle result
        function checkBattleResult(bossNum) {
            let bossHealth;
            if (bossNum === 1) bossHealth = boss1Health;
            else if (bossNum === 2) bossHealth = boss2Health;
            else bossHealth = boss3Health;
            
            if (bossHealth <= 0) {
                // Boss defeated
                if (bossNum === 3) {
                    // All bosses defeated
                    showResult(true);
                } else {
                    // Move to next boss
                    setTimeout(() => {
                        document.getElementById('boss' + bossNum).style.display = 'none';
                        currentBoss++;
                        document.getElementById('boss' + currentBoss).style.display = 'flex';
                    }, 1000);
                }
            } else if (playerHealth <= 0) {
                // Player defeated
                showResult(false);
            }
        }
        
        // Show result
        function showResult(victory) {
            document.querySelectorAll('.boss-container').forEach(boss => {
                boss.style.display = 'none';
            });
            
            const resultScreen = document.getElementById('result-screen');
            resultScreen.style.display = 'flex';
            
            if (victory) {
              resultMessage.innerHTML = "CHÚC MỪNG SINH NHẬT<br><img src='54ceb0d1-83fc-4236-ad8c-8d45cd925893.jpg' alt='' style='max-width: 300px; margin-top: 10px'>";
                createConfetti();
            } else {
                resultMessage.textContent = "THUA RỒI";
            }
        }
        
        // Confetti effect
        function createConfetti() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = -10 + 'px';
                confetti.style.width = Math.random() * 10 + 5 + 'px';
                confetti.style.height = confetti.style.width;
                
                document.body.appendChild(confetti);
                
                const animationDuration = Math.random() * 3 + 2;
                
                confetti.animate([
                    { top: '-10px', transform: 'rotate(0deg)' },
                    { top: '100vh', transform: 'rotate(360deg)' }
                ], {
                    duration: animationDuration * 1000,
                    easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)',
                    delay: Math.random() * 2000
                });
                
                setTimeout(() => {
                    confetti.remove();
                }, animationDuration * 1000);
            }
        }
    </script>
</body>
</html>
